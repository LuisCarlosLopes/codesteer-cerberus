name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  self-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/codesteer-test-guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: guard.py self-test
        run: python3 scripts/guard.py --self-test

      - name: Install tree-sitter deps
        run: pip install tree-sitter tree-sitter-typescript

      - name: assertion_guard.py self-test
        run: python3 scripts/assertion_guard.py --self-test

      - name: spec_lint.py self-test
        run: python3 scripts/spec_lint.py --self-test
